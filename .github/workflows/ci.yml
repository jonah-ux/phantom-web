name: starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser chromium
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-web-browser-evidence
          path: |
            output/playwright/
            .playwright-cli/
          if-no-files-found: ignore
